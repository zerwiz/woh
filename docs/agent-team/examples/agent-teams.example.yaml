---
## Research Team Configuration
## Purpose: File exploration, analysis, documentation
## Members: scout, analyst, researcher, reader, indexer

research-team:
  - scout            # Explore and gather context
  - analyst          # Gather information systematically
  - researcher       # Research and document
  - reader           # Document and organize
  - indexer          # Create indexes and summaries

---
## Development Team Configuration
## Purpose: Code development, implementation, refactoring
## Members: coder, coder-reviewer, tester, archivist

development-team:
  - coder            # Implement code from specifications
  - coder-reviewer   # Code quality assurance
  - tester           # Functional testing
  - archivist        # Document changes and updates

---
## Operations Team Configuration
## Purpose: Monitoring, maintenance, deployment
## Members: monitor, maintainer, deployer

operations-team:
  - monitor          # Monitor system health and status
  - maintainer       # Perform maintenance tasks
  - deployer         # Handle deployment and releases

---
## Full Team Configuration (All in Default Team)
## Purpose: Combined capabilities
## Members: All agents from all teams

default-team:
  - scout
  - analyst
  - researcher
  - reader
  - indexer
  - coder
  - coder-reviewer
  - tester
  - archivist
  - monitor
  - maintainer
  - deployer

---
## Minimal Team Configuration
## Purpose: Start small, grow as needed
## Members: Essential agents only

minimal-team:
  - scout
  - coder
  - reviewer

