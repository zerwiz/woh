## Team Selection Guide

### When to Choose Which Team

**Choose research-team for:**
- File exploration tasks
- Information gathering
- Document creation
- Research activities
- Context building

**Choose development-team for:**
- Code implementation
- Code refactoring
- Testing and validation
- Documentation updates
- Feature development

**Choose operations-team for:**
- System monitoring
- Maintenance tasks
- Deployment activities
- Log analysis
- Issue resolution

**Choose default-team for:**
- Complex multi-step tasks
- Tasks requiring multiple capabilities
- Unassigned tasks (uses all agents)

---
## Team Best Practices

### Team Size
- Keep teams focused (3-5 members)
- Related agent types per team
- Avoid cross-territory pollution

### Team Naming
- Use clear, descriptive names
- Match team purpose to name
- Example: `research`, `development`, `operations`

### Team Isolation
- Each team has own specialist agents
- Dispatcher only accesses team members
- Prevents scope creep

### Team Switching
```bash
/agents-team research      # Research tasks
/agents-team development   # Development tasks
/agents-team operations    # Operations tasks
```

### Team Definition
```yaml
# Valid YAML format
team-name:
  - agent1
  - agent2
  - agent3

# Invalid examples (will be ignored silently)
non-existant-agent:
  - agent1

empty-team:    # Empty teams are valid
```

---
## Team Loading Process

1. Teams automatically loaded from `.pi/agents/teams.yaml`
2. Team selection via /agents-team command
3. Only team members available for dispatch
4. First team loaded as default if none specified

