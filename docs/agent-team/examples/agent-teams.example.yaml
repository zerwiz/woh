## Team Migration Examples

### Single Team to Multiple Teams

**Before:**
```yaml
# Single team
default:
  - scout
  - coder
  - reviewer
```

**After:**
```yaml
# Multiple teams
research:
  - scout
  - researcher

development:
  - coder
  - coder-reviewer
  - tester
```

---
## Team Configuration Tips

### 1. Keep Teams Small
Avoid teams with 10+ members. Better to have:
- research (3-5 agents)
- development (3-5 agents)
- operations (2-4 agents)

### 2. Match Agents to Purpose
- Each agent should align with team purpose
- Scout in research team = natural fit
- Coder in development team = natural fit

### 3. Document Team Purpose
Add comments explaining team purpose:
```yaml
# Research and documentation team
# Handles exploration, analysis, and documentation
research:
  - scout
```

### 4. Test Team Loading
After editing teams.yaml:
```bash
pi -e extensions/agent-team.ts
/agents-team           # See available teams
/agents-team research  # Test team switching
```

---
## Team Validation

### Valid Team
```yaml
valid-team:
  - agent-one
  - agent-two
```

### Invalid Team (Ignored Silently)
```yaml
invalid-team:
  - non-existent
  # This team will be ignored
```

### Empty Team (Valid)
```yaml
empty-team:  # Empty team, still valid
```

